[package]
name = "cdbs-proc"
version = "0.1.2"
edition = "2021"
authors = ["mnnxp <mananaxep@gmail.com>"]
resolver = "1"
rust-version = "1.70.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = "1.46.1"
reqwest = { version = "0.11.9", features = ["json"] }
futures = { version = "0.3.31", default-features = false }

uuid = { version = "0.8.2", features = ["serde", "v4"] }
time = "0.3.41"
chrono = { version = "0.4.41", features = ["serde"] }

diesel = { version = "1.4.8", features = ["postgres", "uuidv07", "uuid", "chrono", "r2d2"] }
r2d2 = "0.8.10"

dotenv = "0.15.0"
structopt = "0.3.26"

thiserror = "2.0.12"

regex = "1.11.1"

sha2 = "0.10.9"
base64 = "0.22.1"

digest = "0.10.7"
blake3 = "1.8.2"
bytes = "1.10.1"

serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.140"

rusoto_core = "0.48.0"
rusoto_s3 = "0.48.0"
rusoto_signature = "0.48.0"

log = "0.4.27"
env_logger ="0.9.0"
