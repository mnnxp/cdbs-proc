[package]
name = "cdbs-proc"
version = "0.1.0"
edition = "2021"
authors = ["mnnxp <mananaxep@gmail.com>"]
resolver = "1"
rust-version = "1.56.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = "1.15.0"
reqwest = { version = "0.11.9", features = ["json"] }
futures = { version = "0.3.19", default-features = false }

uuid = { version = "0.8.2", features = ["serde", "v4"] }
time = "0.3.6"
chrono = { version = "0.4.19", features = ["serde"] }

diesel = { version = "1.4.8", features = ["postgres", "uuidv07", "uuid", "chrono", "r2d2"] }
r2d2 = "0.8.9"

dotenv = "0.15.0"
structopt = "0.3.26"

anyhow = "1.0.53"
thiserror = "1.0.30"

regex = "1.5.4"

ring = "0.16.20"
sha2 = "0.10.1"
hmac = "0.12.0"
base64 = "0.13.0"
hex = "0.4.3"

digest = "0.10.1"
blake3 = "1.3.0"
bytes = "1.1.0"

serde = "1.0.134"
serde_derive = "1.0.134"
serde_json = "1.0.75"

rusoto_core = "0.47.0"
rusoto_s3 = "0.47.0"
rusoto_signature = "0.47.0"

lazy_static = "1.4.0"
log = "0.4.14"
env_logger ="0.9.0"
